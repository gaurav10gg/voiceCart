services:
  # One container runs the shop and the agent, the way they run locally.
  # Render's free tier gives 750 instance hours a month, so a single always-on
  # service (~730 hours) fits with room to spare — two would not.
  - type: web
    name: voicecart
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: AGENT_SHARED_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NUM_CPUS
        value: "1"
